name: Robo Cripto
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: robo
  cancel-in-progress: false
jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar robô
        run: python robo.py
      - name: Gerar index.html
        run: cp painel.html index.html
      - name: Salvar estado e painel
        run: |
          git config user.name "robo"
          git config user.email "robo@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "rodada $(date -u +%F)" && git push)
